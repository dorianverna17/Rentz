</head><body><main>
<h1>♠ Rentz ♥</h1>
<div id="lobby">
 <div id="home"><p class="s">4 players, 32 cards. Mix humans (same device or online) with bots.</p>
  <div class="bar">Name <input id="name" placeholder="Your name" maxlength="16"></div>
  <div class="bar"><button class="b" id="bh">Host online game</button><button class="b" id="bl">Play locally / vs bots</button></div>
  <div class="bar">Join code <input id="code" size="8"><button class="b" id="bj">Join</button></div>
  <div class="bar"><button class="b g" id="bhist">Match history</button></div></div>
 <div id="hist" hidden><div class="bar"><button class="b g" id="hback">Back</button></div><div id="hlist"></div></div>
 <div id="cfg" hidden><div id="share" class="s"></div><div id="seatsel"></div>
  <div class="bar">Deals <select id="nd"><option value="8">8 (short)</option><option value="32">32 (full)</option></select><button class="b" id="bs">Start</button></div>
  <p class="s">Open online seats left empty are filled by bots, and a seat can be taken over by a player who joins later.</p></div>
 <p id="status" class="s"></p></div>
<div id="game" hidden>
 <div id="hdr"></div><table id="sc"></table><div id="tbl"></div><div id="pick"></div>
 <div id="dock"><p id="msg"></p><div id="hand"></div><div class="bar"><button class="b" id="pass" disabled>Pass</button></div></div><div id="again"></div><div class="bar"><button class="b g" id="quit"></button></div></div>
<div id="gate" hidden></div>
<script>
// ===== ENGINE (no DOM dependency) =====
const SUITS=['♣','♦','♥','♠'],RL={11:'J',12:'Q',13:'K',14:'A'};
const cs=c=>(RL[c.r]||c.r)+SUITS[c.s];
// Default scoring – tweak to match your house rules.
const SC={kingHearts:-40,queens:-5,diamonds:-5,tenClubs:20,tricks:-5,whist:10,rentz:[60,30,10,0]};
// Single-card contracts end as soon as the card is taken.
const STOP={kingHearts:c=>c.r===13&&c.s===2,tenClubs:c=>c.r===10&&c.s===0};
const CONTRACTS=['kingHearts','queens','diamonds','tenClubs','tricks','totals','whist','rentz'];
const NAMES={kingHearts:'King of Hearts',queens:'Queens',diamonds:'Diamonds',tenClubs:'10 of Clubs',tricks:'Tricks',totals:'Totals',whist:'Whist (+)',rentz:'Rentz (+)'};
const EXPECT={kingHearts:-40,queens:-20,diamonds:-40,tenClubs:20,tricks:-40,totals:-120,whist:80,rentz:100}; // per-deal score sums
function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function deck(){const d=[];for(let s=0;s<4;s++)for(let r=7;r<=14;r++)d.push({s,r});return d}
function shuffle(a,R){for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

class Deal{
  constructor(k,caller,hands){
    this.k=k;this.hands=hands.map(h=>h.slice());this.turn=caller;this.log=[];this.rentz=k==='rentz';
    if(this.rentz){this.layout={};this.open=null;this.out=null}
    else{this.trick=[];this.won=[[],[],[],[]];this.nTricks=0}
  }
  // Rentz: first card sets the open rank; other suits may only be started with that rank;
  // each suit then extends up/down by one (no wrap). A player with no legal card passes (null).
  legal(){
    const h=this.hands[this.turn];
    if(this.rentz){
      if(this.open===null){const j=h.filter(c=>c.r===11);return j.length?j:[null]} // only a J can start; no J = pass
      const m=h.filter(c=>{const L=this.layout[c.s];return L?(c.r===L.hi+1||c.r===L.lo-1):c.r===this.open});
      return m.length?m:[null];
    }
    if(!this.trick.length)return h.slice();           // leader: anything
    const led=this.trick[0].c.s,f=h.filter(c=>c.s===led);
    return f.length?f:h.slice();                      // must follow suit, no trumps
  }
  obs(){return{me:this.turn,contract:this.k,hand:this.hands[this.turn].slice(),
    trick:this.trick&&this.trick.map(t=>({p:t.p,c:t.c})),layout:this.layout,open:this.open,sizes:this.hands.map(h=>h.length),played:this.played()}}
  played(){ // every card already played (public information)
    if(this.rentz)return Object.entries(this.layout).flatMap(([s,L])=>{const a=[];for(let r=L.lo;r<=L.hi;r++)a.push({s:+s,r});return a});
    return this.won.flat().concat(this.trick.map(t=>t.c))}
  play(c){
    const p=this.turn,h=this.hands[p];
    if(c)h.splice(h.indexOf(c),1);
    this.log.push(`P${p+1} ${c?cs(c):'pass'}`);
    if(this.rentz){
      if(c){if(this.open===null)this.open=c.r;const L=this.layout[c.s];
        if(L){L.lo=Math.min(L.lo,c.r);L.hi=Math.max(L.hi,c.r)}else this.layout[c.s]={lo:c.r,hi:c.r}}
      if(!h.length&&this.out===null)this.out=p;
      this.turn=(p+1)%4;return;
    }
    this.trick.push({p,c});
    if(this.trick.length<4){this.turn=(p+1)%4;return}
    const led=this.trick[0].c.s;let w=this.trick[0];
    for(const t of this.trick)if(t.c.s===led&&t.c.r>w.c.r)w=t;
    this.won[w.p].push(...this.trick.map(t=>t.c));
    this.log.push(`→ P${w.p+1} wins the trick`);
    this.trick=[];this.nTricks++;this.turn=w.p;
  }
  over(){return this.rentz?this.out!==null:this.nTricks===8||(!!STOP[this.k]&&this.won.some(w=>w.some(STOP[this.k])))}
  score(){
    const s=[0,0,0,0];
    if(this.rentz){ // first out = 1st; the rest ranked by fewest cards left; ties share points
      const n=k=>k===this.out?-1:this.hands[k].length,o=[0,1,2,3].sort((a,b)=>n(a)-n(b));
      for(let i=0,j;i<4;i=j){j=i;while(j<4&&n(o[j])===n(o[i]))j++;
        const avg=SC.rentz.slice(i,j).reduce((x,y)=>x+y)/(j-i);for(let k=i;k<j;k++)s[o[k]]=avg}
      return s;
    }
    for(let p=0;p<4;p++){
      const w=this.won[p],cnt=f=>w.filter(f).length,t=w.length/4;
      const K=cnt(c=>c.r===13&&c.s===2)*SC.kingHearts,Q=cnt(c=>c.r===12)*SC.queens,D=cnt(c=>c.s===1)*SC.diamonds,
            T=cnt(c=>c.s===0&&c.r===10)*SC.tenClubs,R=t*SC.tricks;
      s[p]={kingHearts:K,queens:Q,diamonds:D,tenClubs:T,tricks:R,whist:t*SC.whist,totals:K+Q+D+T+R}[this.k];
    }
    return s;
  }
}

// ===== BOTS: same interface for random now, smarter later =====
const randomBot={
  choose:(avail,R)=>avail[Math.floor(R()*avail.length)],
  move:(obs,legal,R)=>legal[Math.floor(R()*legal.length)]
};


const BOT=typeof smartBot!=='undefined'?smartBot:randomBot; // bots.js provides smartBot
// ===== MATCH (host-authoritative; runs on the host's device) =====
const $=id=>document.getElementById(id),ck=c=>c.s+'-'+c.r,red=c=>c.s===1||c.s===2;
const face=c=>{const r=RL[c.r]||c.r,x=SUITS[c.s];return`<i>${r}<br>${x}</i><b>${x}</b><i class="br">${r}<br>${x}</i>`};
const cardH=c=>`<span class="c ${red(c)?'rd':''}">${face(c)}</span>`;
class Match{
  constructor(seats,n,cb){this.seats=seats;this.n=n;this.cb=cb;this.R=Math.random;this.d=-1;this.tot=[0,0,0,0];this.hist=[];
    this.left=[0,1,2,3].map(()=>CONTRACTS.slice())}
  next(){this.d++;if(this.d>=this.n){this.phase='over';return this.cb()}
    this.caller=this.d%4;const dk=shuffle(deck(),this.R);
    this.hands=[0,1,2,3].map(p=>dk.slice(p*8,p*8+8).sort((a,b)=>a.s-b.s||a.r-b.r));
    this.g=null;this.res=null;this.last=null;this.phase='choose';this.cb();this.sched()}
  actor(){return this.phase==='choose'?this.caller:this.g.turn}
  sched(delay=700){clearTimeout(this.t);if(this.phase==='over'||this.phase==='dealover')return;
    const auto=this.seats[this.actor()].type==='bot'; // bots pass by themselves; humans press Pass
    if(auto)this.t=setTimeout(()=>this.auto(),delay)}
  auto(){const a=this.actor(),B=this.seats[a].bot||BOT;
    if(this.phase==='choose')return this.choose(a,B.choose(this.left[a],this.R,{hand:this.hands[a],tot:this.tot,seat:a}));
    const l=this.g.legal();this.move(a,l[0]===null?null:ck(B.move(this.g.obs(),l,this.R)))}
  choose(s,k){if(this.phase!=='choose'||s!==this.caller||!this.left[s].includes(k))return;
    this.left[s].splice(this.left[s].indexOf(k),1);this.g=new Deal(k,this.caller,this.hands);this.phase='play';this.cb();this.sched()}
  move(s,kk){if(this.phase!=='play'||this.g.turn!==s)return;const g=this.g,l=g.legal();let c=null;
    if(kk!==null){c=g.hands[s].find(x=>ck(x)===kk);if(!c||!l.includes(c))return}else if(l[0]!==null)return;
    const full=g.trick&&g.trick.length===3,tr=full?g.trick.concat([{p:s,c}]):null;
    g.play(c);
    if(full)this.last={trick:tr,winner:g.turn};else if(g.trick&&g.trick.length)this.last=null;
    if(g.over())return this.finish();
    this.cb();this.sched(full?1500:700)}
  finish(){const g=this.g,s=g.score();s.forEach((v,i)=>this.tot[i]+=v);this.res={k:g.k,s};this.hist.push(this.res);
    this.phase='dealover';this.cb();clearTimeout(this.t);this.t2=setTimeout(()=>this.next(),4000)}
  view(s){const g=this.g,r=g&&g.rentz;
    return{seat:s,names:this.seats.map(x=>x.name),phase:this.phase,d:this.d,n:this.n,caller:this.caller,k:g?g.k:null,
      left:this.phase==='choose'&&this.caller===s?this.left[s]:null,turn:g?g.turn:null,
      hand:(g?g.hands[s]:this.hands[s]).map(c=>({s:c.s,r:c.r})),counts:(g?g.hands:this.hands).map(h=>h.length),
      legal:this.phase==='play'&&g.turn===s?g.legal().map(c=>c&&ck(c)):null,
      trick:g&&g.trick?g.trick:null,last:this.last,layout:r?g.layout:null,open:r?g.open:null,
      tricks:g&&g.won?g.won.map(w=>w.length/4):null,tot:this.tot,res:this.res}}
}

// ===== NETWORK / SESSION =====
const clean=t=>String(t).replace(/[<>&"'`\\]/g,'').trim().slice(0,16)||'Player';
const DB='https://verian-5bbb7-default-rtdb.europe-west1.firebasedatabase.app';
const NET=typeof EventSource!=='undefined'&&typeof fetch!=='undefined';
let M=null,seats=[],peer=null,conn=null,mode='',ds=0,gate=false;
const status=t=>$('status').textContent=t;
const mkSeats=()=>{seats=[{kind:'host',name:clean($('name').value||'Host')},...[1,2,3].map(i=>({kind:'bot',name:'Player '+(i+1)}))]};
function showCfg(){$('home').hidden=true;$('cfg').hidden=false;lobbyUI()}
function lobbyUI(){
  $('seatsel').innerHTML=seats.map((s,i)=>i===0?`<div>Seat 1: ${s.name} (you)</div>`:
    `<div>Seat ${i+1}: <select data-i="${i}"><option value="bot">Bot</option>${peer?'<option value="remote">Online player</option>':''}<option value="local">Same device</option></select> ${s.kind==='remote'?(s.conn?'✔ '+s.name:'waiting…'):''}</div>`).join('');
  $('seatsel').querySelectorAll('select').forEach(sel=>{const s=seats[sel.dataset.i];sel.value=s.kind;
    sel.onchange=()=>{s.kind=sel.value;s.name='Player '+(+sel.dataset.i+1);if(s.kind!=='remote'&&s.conn){const c=s.conn;s.conn=null;c.close()}lobbyPush()}})}
// Online play: the host's browser runs the game; moves travel through Firebase Realtime Database (REST + EventSource, no SDK).
// Every value is stored as a JSON string so Firebase cannot drop nulls or empty arrays.
const FB=(m,p,b,q='')=>fetch(`${DB}/${p}.json${q}`,{method:m,body:b===undefined?undefined:JSON.stringify(b)}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()});
const Q={},fbq=(p,b)=>Q[p]=(Q[p]||Promise.resolve()).catch(()=>{}).then(()=>FB('PUT',p,b)); // per-path queue keeps writes in order
let room='',cid='',streams=[],timers=[],clients={},known={},bt={};
const stopAll=()=>{streams.forEach(e=>e.close());timers.forEach(clearInterval);streams=[];timers=[]};
function stream(p,fn){let tree=null;const es=new EventSource(`${DB}/${p}.json`);
  const setAt=(path,val)=>{if(path==='/'){tree=val;return}
    const ks=path.split('/').filter(Boolean);if(tree===null||typeof tree!=='object')tree={};let o=tree;
    for(let i=0;i<ks.length-1;i++){if(o[ks[i]]===null||typeof o[ks[i]]!=='object')o[ks[i]]={};o=o[ks[i]]}
    const l=ks[ks.length-1];if(val===null)delete o[l];else o[l]=val};
  es.addEventListener('put',e=>{const m=JSON.parse(e.data);setAt(m.path,m.data);fn(tree)});
  es.addEventListener('patch',e=>{const m=JSON.parse(e.data);for(const[k,v]of Object.entries(m.data||{}))setAt((m.path==='/'?'':m.path)+'/'+k,v);fn(tree)});
  streams.push(es);return es}
function writeLobby(){if(!room||mode!=='host')return;
  fbq(`rooms/${room}/lobby`,{n:JSON.stringify(seats.map(s=>s.kind==='bot'?'Bot':s.kind==='remote'&&!s.conn?'(open)':s.name)),ts:Date.now(),playing:!!M})}
function lobbyPush(){lobbyUI();writeLobby()}
function mkConn(id){return{cid:id,
  send(m){if(m.t==='view')fbq(`rooms/${room}/views/${this._i}`,JSON.stringify(m.v));
    else if(m.t==='seat')fbq(`rooms/${room}/assign/${id}`,m.seat);
    else if(m.t==='full')fbq(`rooms/${room}/assign/${id}`,-1)},
  close(){delete clients[id];fbq(`rooms/${room}/assign/${id}`,-1)}}}
function onHello(id,name){
  const c=mkConn(id),i=seats.findIndex(s=>s.kind==='remote'&&!s.conn);
  if(i<0){c.send({t:'full'});return}
  c._i=i;clients[id]=c;bt[id]={v:undefined,at:Date.now()};seats[i].conn=c;seats[i].name=name;c.send({t:'seat',seat:i});
  if(M){M.seats[i]={name,type:'human'};push();M.sched()}else lobbyPush()}
function hostGone(c){const i=c._i;delete clients[c.cid];delete bt[c.cid];
  if(i===undefined||seats[i].conn!==c)return;seats[i].conn=null;
  if(M){M.seats[i]={name:'Bot '+(i+1),type:'bot'};push();M.sched()}else lobbyPush()}
async function hostNet(){
  peer=true;
  try{let code;for(let k=0;k<5;k++){code=Math.random().toString(36).slice(2,7).toUpperCase();if(!(await FB('GET',`rooms/${code}/lobby`)))break}
    room=code;clients={};known={};bt={};
    await fbq(`rooms/${room}/lobby`,{n:'[]',ts:Date.now(),playing:false});
    $('share').innerHTML=`Room code <b>${code}</b> · invite link <input readonly size="34" value="${location.href.split('#')[0]}#${code}" onclick="this.select()">`;
    lobbyPush();
    stream(`rooms/${room}/hello`,t=>{const cur=t&&typeof t==='object'?t:{};
      for(const[id,v]of Object.entries(cur))if(!known[id]){known[id]=1;onHello(id,clean((v&&v.name)||'Player'))}
      for(const id of Object.keys(known))if(!(id in cur)){delete known[id];if(clients[id])hostGone(clients[id])}});
    const done={};
    stream(`rooms/${room}/acts`,t=>{if(!t||typeof t!=='object')return;
      for(const[k,v]of Object.entries(t)){if(done[k])continue;done[k]=1;FB('DELETE',`rooms/${room}/acts/${k}`).catch(()=>{});
        const c=v&&clients[v.cid];if(!c||!M)continue;
        try{const a=JSON.parse(v.s);a.t==='choose'?M.choose(c._i,a.k):M.move(c._i,a.key===undefined?null:a.key)}catch(e){}}});
    // heartbeat: refresh the lobby timestamp, and drop guests whose beat stopped changing for 25s
    timers.push(setInterval(async()=>{writeLobby();
      try{const b=(await FB('GET',`rooms/${room}/beat`))||{},now=Date.now();
        for(const id of Object.keys(clients)){const x=bt[id]||(bt[id]={v:undefined,at:now});if(b[id]!==x.v){x.v=b[id];x.at=now}
          if(now-x.at>25000)hostGone(clients[id])}}catch(e){}},5000));
  }catch(e){status('Network error: could not reach the game database. ('+e.message+')')}}
function start(){
  if(M){clearTimeout(M.t);clearTimeout(M.t2)}
  const ms=seats.map((s,i)=>{const h=s.kind==='host'||s.kind==='local'||(s.kind==='remote'&&s.conn);return{name:h?s.name:'Bot '+(i+1),type:h?'human':'bot'}});
  M=new Match(ms,+$('nd').value,push);ds=0;gate=false;writeLobby();M.next()}
const isLocal=i=>seats[i].kind==='host'||seats[i].kind==='local';
function push(){
  seats.forEach((s,i)=>{if(s.conn&&M.seats[i].type==='human')try{s.conn.send({t:'view',v:M.view(i)})}catch(e){}});
  const locals=seats.map((s,i)=>i).filter(i=>isLocal(i)&&M.seats[i].type==='human');
  const a=M.phase==='choose'?M.caller:(M.g&&M.phase==='play'?M.g.turn:null);
  if(a!==null&&locals.includes(a)&&a!==ds){gate=locals.length>1;ds=a}
  render(M.view(ds),gate);
  if(M.phase==='over'&&!M.saved){M.saved=true;saveHistory()}}
const rid=()=>Math.random().toString(36).slice(2,10);
async function join(){
  const code=$('code').value.toUpperCase().trim();if(!code)return;
  if(!NET)return status('Your browser does not support online play.');
  mode='guest';status('Connecting…');
  try{
    if(!(await FB('GET',`rooms/${code}/lobby`)))return status('No room with that code. Check the code, and make sure the host still has the page open.');
    room=code;cid=rid();let seat=null,lastSeen=Date.now(),sawPlay=false;
    await FB('PUT',`rooms/${room}/hello/${cid}`,{name:($('name').value||'Guest').slice(0,16)});
    stream(`rooms/${room}/assign/${cid}`,t=>{if(typeof t!=='number'||seat!==null)return;
      if(t<0){status('You were removed from the room (it may be full).');stopAll();return}
      seat=t;$('home').hidden=true;status('Connected as seat '+(t+1)+'. Waiting for the host to start…');
      stream(`rooms/${room}/views/${seat}`,v=>{if(typeof v==='string')render(JSON.parse(v),false)});
      let n=0;timers.push(setInterval(()=>FB('PUT',`rooms/${room}/beat/${cid}`,++n).catch(()=>{}),5000))});
    stream(`rooms/${room}/lobby`,t=>{lastSeen=Date.now();
      if(t===null){status('The host closed the room.');return}
      if(t&&t.n&&!sawPlay&&$('game').hidden)status('Players: '+JSON.parse(t.n).join(', '));
      if(t&&t.playing)sawPlay=true;
      else if(t&&sawPlay){sawPlay=false;$('game').hidden=true;$('lobby').hidden=false;status('The host cancelled the game. Waiting for a new one…')}});
    timers.push(setInterval(()=>{if(Date.now()-lastSeen>20000)status('The host seems to be offline.')},5000));
  }catch(e){status('Network error. Check your connection and try again. ('+e.message+')')}}
function act(a){if(mode==='guest')return FB('POST',`rooms/${room}/acts`,{cid,s:JSON.stringify(a)}).catch(()=>status('Network error while sending your move.'));
  a.t==='choose'?M.choose(ds,a.k):M.move(ds,a.key)}
function quit(){
  if(mode==='guest'){if(!confirm('Leave this game? A bot will take your seat.'))return;
    stopAll();FB('DELETE',`rooms/${room}/hello/${cid}`).catch(()=>{});
    mode='';room='';$('game').hidden=true;$('lobby').hidden=false;$('home').hidden=false;status('You left the game.');return}
  if(!confirm('Cancel the game for everyone?'))return;
  clearTimeout(M.t);clearTimeout(M.t2);M=null;gate=false;
  $('game').hidden=true;$('gate').hidden=true;$('lobby').hidden=false;lobbyPush();
  status('Game cancelled. Adjust the seats and press Start for a new one.')}
// ===== MATCH HISTORY (stored under /history in the database; one write-once record per finished match) =====
function saveHistory(){if(!NET||!M)return;
  FB('POST','history',{t:Date.now(),n:M.n,online:!!room,names:JSON.stringify(M.seats.map(x=>x.name)),tot:JSON.stringify(M.tot),
    deals:JSON.stringify(M.hist.map((h,i)=>({c:i%4,k:h.k,s:h.s})))}).catch(()=>{})}
const esc=t=>String(t).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
async function showHist(){
  $('home').hidden=true;$('hist').hidden=false;const L=$('hlist');L.textContent='Loading…';
  try{const d=(await FB('GET','history',undefined,'?orderBy=%22%24key%22&limitToLast=20'))||{};
    const rows=Object.values(d).filter(r=>r&&r.t).sort((a,b)=>b.t-a.t);
    if(!rows.length){L.textContent='No matches saved yet. Finished matches are saved here automatically.';return}
    L.innerHTML=rows.map(r=>{try{const N=JSON.parse(r.names),tot=JSON.parse(r.tot),D=JSON.parse(r.deals||'[]'),mx=Math.max(...tot);
      const win=N.filter((n,i)=>tot[i]===mx).map(esc).join(' & ');
      return`<details><summary>${esc(new Date(r.t).toLocaleString())} · <b>${win}</b> won · ${r.online?'online':'local'} · ${esc(r.n)} deals</summary><table><tr><th>#<th>Contract${N.map(n=>`<th>${esc(n)}`).join('')}</tr>`+
        D.map((x,i)=>`<tr><td>${i+1}<td>${esc(NAMES[x.k]||x.k)}${x.s.map(v=>`<td>${esc(v)}`).join('')}`).join('')+
        `<tr><th colspan="2">Total${tot.map(v=>`<th>${esc(v)}`).join('')}</tr></table></details>`}catch(e){return''}}).join('')
  }catch(e){L.textContent='Could not load history ('+e.message+'). If it says HTTP 401, update the Firebase rules.'}}
addEventListener('beforeunload',()=>{ // best-effort cleanup
  if(room&&mode==='host')fetch(`${DB}/rooms/${room}.json`,{method:'DELETE',keepalive:true});
  else if(room&&mode==='guest')fetch(`${DB}/rooms/${room}/hello/${cid}.json`,{method:'DELETE',keepalive:true})});

// ===== RENDER =====
function render(v,g){
  $('lobby').hidden=true;$('game').hidden=false;$('gate').hidden=!g;
  const N=v.names,act_=v.phase==='choose'?v.caller:v.turn,tl=n=>(n>0?'+':'')+n;
  if(g){$('gate').innerHTML=`<p>Pass the device to <b>${N[v.seat]}</b></p><button class="b" id="rev">Reveal my cards</button>`;$('rev').onclick=()=>{gate=false;render(v,false)}}
  $('hdr').innerHTML=`<b>Deal ${Math.min(v.d+1,v.n)} of ${v.n}</b>${v.k?` · ${NAMES[v.k]}`:''} <span class="s">· caller ${N[v.caller]}</span>`;
  $('sc').innerHTML='<tr><th>Player<th>Cards'+(v.tricks?'<th>Tricks':'')+'<th>Total</tr>'+
    N.map((n,i)=>`<tr${i===act_&&v.phase!=='over'?' class="sel"':''}><td>${i===v.seat?'★ ':''}${n}<td>${v.counts[i]}${v.tricks?`<td>${v.tricks[i]}`:''}<td>${tl(v.tot[i])}`).join('');
  let t='';
  if(v.layout)t=`<div class="s">${v.open===null?'Only a J can start. Players without a J pass; the other suits then start with their J.':'Opening rank: '+(RL[v.open]||v.open)}</div>`+[0,1,2,3].map(s=>{const L=v.layout[s];let r='';if(L)for(let x=L.lo;x<=L.hi;x++)r+=cardH({s,r:x});return`<div class="row">${r||`<span class="s">${SUITS[s]} –</span>`}</div>`}).join('');
  else if(v.k){const cur=v.trick&&v.trick.length,tr=cur?v.trick:(v.last?v.last.trick:[]);
    t='<div class="slots">'+N.map((n,i)=>{const x=tr.find(q=>q.p===i);return`<div>${n}<br>${x?cardH(x.c):'–'}</div>`}).join('')+'</div>'+(!cur&&v.last?`<div class="s">${N[v.last.winner]} took the trick</div>`:'')}
  else t='<div class="s">Waiting for the contract…</div>';
  $('tbl').innerHTML=t;
  $('pick').innerHTML=v.left?v.left.map(k=>`<button class="b" data-k="${k}">${NAMES[k]}</button>`).join(' '):'';
  let m='';
  if(v.phase==='over'){const mx=Math.max(...v.tot);m='<b>Match over.</b> Winner: '+N.filter((n,i)=>v.tot[i]===mx).join(' & ')}
  else if(v.phase==='dealover')m=`<b>${NAMES[v.res.k]}:</b> `+N.map((n,i)=>`${n} ${tl(v.res.s[i])}`).join(', ')+' (next deal soon…)';
  else if(v.phase==='choose')m=v.left?'<b>Your call:</b> pick a contract (you have your cards below).':`${N[v.caller]} is choosing a contract…`;
  else m=v.legal?(v.legal[0]===null?'<b>You have no playable card.</b> Press Pass.':'<b>Your turn</b>'):`${N[v.turn]} to play…`;
  $('msg').innerHTML=m;
  $('hand').innerHTML=v.hand.map(c=>`<button class="c ${red(c)?'rd':''}" data-k="${ck(c)}"${v.legal&&v.legal.includes(ck(c))?'':' disabled'}>${face(c)}</button>`).join('');
  $('pass').disabled=!(v.legal&&v.legal[0]===null);
  $('again').innerHTML=v.phase==='over'&&mode==='host'?'<button class="b" id="na">New match</button>':'';
  if($('na'))$('na').onclick=start;
  $('quit').textContent=mode==='guest'?'Leave game':'Cancel game'}
$('pick').onclick=e=>{const k=e.target.dataset.k;if(k)act({t:'choose',k})};
$('hand').onclick=e=>{const b=e.target.closest('[data-k]');if(b&&!b.disabled)act({t:'play',key:b.dataset.k})};

// ===== LOBBY WIRING =====
$('bh').onclick=()=>{if(!NET)return status('Online play is not supported in this browser.');mode='host';mkSeats();hostNet();showCfg()};
$('bl').onclick=()=>{mode='host';peer=null;mkSeats();showCfg()};
$('quit').onclick=quit;$('pass').onclick=()=>act({t:'play',key:null});$('bhist').onclick=showHist;$('hback').onclick=()=>{$('hist').hidden=true;$('home').hidden=false};$('bj').onclick=join;$('bs').onclick=start;
if(location.hash.length>1)$('code').value=location.hash.slice(1);
if(!NET)status('Online play is not supported in this browser. Local play still works.');
</script></main></body></html>
